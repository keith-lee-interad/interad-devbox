<script>
    $(document).ready(function() {
        if (DVL.lang == "en") {

                        <p class="mar-b-0"><button class="collapse-toggle collapsed chevron-toggle" data-target="#collapse-ie-msg-en" data-toggle="collapse" aria-expanded="false" aria-controls="collapse-ie-msg-en" style="color: #a15900;"><img src="/dvl/v1.0/assets/images/icons/icon-warning.svg" class="mar-r-hlf" height="20" width="20" style="vertical-align: text-bottom;"><strong>Notice: Internet Explorer No Longer Supported</strong></button></p>\
                        <div class="collapse-content collapse w-100" id="collapse-ie-msg-en">\
                            <div class="collapse-inner pad-t-hlf">\
                                <p>Due to Microsoft retiring Internet Explorer, we are no longer supporting the Explorer browser across our websites. Please switch to another browser for a better viewing experience.</p>\
                            </div>\
                        </div>\
                    </div>\
                </div>'
            )
        } else if (DVL.lang == "fr") {
            $('header').before(
                '<div id="ie-messaging" class="alert warning" role="complementary" style="display: block; padding: 0px;">\
                    <div class="alert-content" style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 12px 15px;">\
                        <p class="mar-b-0"><button class="collapse-toggle collapsed chevron-toggle" data-target="#collapse-ie-msg-fr" data-toggle="collapse" aria-expanded="false" aria-controls="collapse-ie-msg-fr" style="color: #a15900;"><img src="/dvl/v1.0/assets/images/icons/icon-warning.svg" class="mar-r-hlf" height="20" width="20" style="vertical-align: text-bottom;"><strong>Avis : Internet Explorer n’est plus pris en charge</strong></button></p>\
                        <div class="collapse-content collapse w-100" id="collapse-ie-msg-fr">\
                            <div class="collapse-inner pad-t-hlf">\
                                <p>En raison du retrait d’Internet Explorer, le navigateur Explorer ne sera plus pris en charge sur nos sites Web. Veuillez passer à un autre navigateur pour avoir une meilleure expérience de visionnement.</p>\
                            </div>\
                        </div>\
                    </div>\
                </div>'
            )    
        }
        var ieCollapse = $('#ie-messaging .collapse-toggle');
        ieCollapse.on('click', function(e) {
            e.preventDefault();
            if (ieCollapse.hasClass('collapsed')) {
                ieCollapse.removeClass('collapsed').attr('aria-expanded', 'true');;
                $('#ie-messaging .collapse-content').slideDown().addClass('show');;
            } else {
                ieCollapse.addClass('collapsed').attr('aria-expanded', 'false');;
                $('#ie-messaging .collapse-content').slideUp().removeClass('show');;    
            }
        });
    });
</script>
